# The workspace run matrix — Build POLICY (which repos the validation
# pipeline runs, under which short key, and which are slow-skip audited).
# Repo IDENTITY must match PyAutoMind/repos.yaml (the body map);
# repos_sync.py --check flags drift. An adopter replaces this file.
#
# run_all: short key -> {repo, report}: `autohands run_all <key>` runs
# <repo>'s scripts and writes reports under <report>.
run_all:
  autofit: {repo: autofit_workspace, report: autofit}
  autogalaxy: {repo: autogalaxy_workspace, report: autogalaxy}
  autolens: {repo: autolens_workspace, report: autolens}
  autofit_test: {repo: autofit_workspace_test, report: autofit_test}
  autogalaxy_test: {repo: autogalaxy_workspace_test, report: autogalaxy_test}
  autolens_test: {repo: autolens_workspace_test, report: autolens_test}
  howtofit: {repo: HowToFit, report: howtofit}
  howtogalaxy: {repo: HowToGalaxy, report: howtogalaxy}
  howtolens: {repo: HowToLens, report: howtolens}
  euclid: {repo: euclid_strong_lens_modeling_pipeline, report: euclid}

# libraries: the released library set (release.yml's matrix order). The
# release board (autohands/board.py) reads this to render versions and PyPI
# status; name = repo, package = the import/PyPI name.
libraries:
  - {name: PyAutoNerves, package: autonerves}
  - {name: PyAutoFit, package: autofit}
  - {name: PyAutoArray, package: autoarray}
  - {name: PyAutoGalaxy, package: autogalaxy}
  - {name: PyAutoLens, package: autolens}

# slow_skip_check: the default audit targets when none are given on the CLI.
slow_skip_default:
  - autofit_workspace
  - autogalaxy_workspace
  - autolens_workspace
  - autofit_workspace_test
  - autolens_workspace_test

# colab_gemini: Colab Gemini instructions (PyAutoHands#324). Per project, the
# repository its notebooks live in (the "<repo>/" prefix the assistant's
# colab/contexts.yaml globs match) and the assistant owning that mapping.
# id_url is the uuid5 seed of each project's instruction id; it must stay
# byte-identical (ids are committed in notebooks, and the assistants derive the
# same ids in autoassistant/colab_contexts.py).
colab_gemini:
  id_url: "https://github.com/PyAutoLabs/colab-gemini/{project}"
  projects:
    autofit: {repo: autofit_workspace, assistant: autofit_assistant}
    autogalaxy: {repo: autogalaxy_workspace, assistant: autogalaxy_assistant}
    autolens: {repo: autolens_workspace, assistant: autolens_assistant}
    howtofit: {repo: HowToFit, assistant: autofit_assistant}
    howtogalaxy: {repo: HowToGalaxy, assistant: autogalaxy_assistant}
    howtolens: {repo: HowToLens, assistant: autolens_assistant}
    autocti: {repo: autocti_workspace, assistant: autocti_assistant}
