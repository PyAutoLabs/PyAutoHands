name: Navigator Check (reusable)

# Reusable workspace-catalogue check, called by each workspace's thin
# navigator_check.yml. The caller passes its generator project name; everything
# else (the check_navigator / regenerate_navigator entrypoints, the staleness
# logic) lives here so the three workspaces share one copy.
#
# Both jobs check out the *caller* workspace (default checkout) plus this repo
# (PyAutoHands), because the navigator entrypoints now live in PyAutoHands.

on:
  workflow_call:
    inputs:
      project:
        description: Generator project name (autolens / autogalaxy / autofit).
        required: true
        type: string

permissions:
  contents: read

jobs:
  paths:
    name: Navigator paths + banner lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: workspace
      - name: Checkout PyAutoHands
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Run navigator checker (paths hard, banners fail)
        run: python PyAutoHands/autohands/check_navigator.py --root workspace --banners=fail

  search_memory:
    # A MultiStart* search left on its default batch_size=None vmaps every
    # start into one value_and_grad. For a memory-heavy likelihood that is
    # tens of GB — it OOMed two nightly release runs in 2026-07 and nothing
    # at authoring time flagged it (PyAutoLabs/PyAutoFit#1452). The runtime
    # guard in autofit relies on XLA memory analysis, which reports 0 on the
    # CPU-only builds CI uses, so this static check is what protects CI.
    name: Unbatched multi-start search check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: workspace
      - name: Checkout PyAutoHands
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No pip install: the checker is stdlib-only (ast + pathlib) on purpose,
      # so it cannot be broken by a dependency resolution problem.
      - name: Check for unbatched multi-start searches
        run: python PyAutoHands/autohands/check_search_memory.py --root workspace

  search_roster:
    # Search rosters, manifest anchors and named searches against the search
    # manifest of the INSTALLED autofit release (search-manifest@1) — the
    # pinned version, never the library's main. The workspace is checked out
    # under its own repository name so the manifest's `<repo>:<path>` anchors
    # resolve against it; for the autofit workspace the integration-test
    # workspace is checked out beside it so both anchor kinds resolve. Other
    # projects' anchors point into repos not checked out here and are skipped.
    name: Search roster vs installed manifest
    runs-on: ubuntu-latest
    env:
      NUMBA_CACHE_DIR: /tmp/numba_cache
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
      - name: Checkout PyAutoHands
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Checkout the integration-test workspace (autofit only)
        if: inputs.project == 'autofit'
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/autofit_workspace_test
          path: autofit_workspace_test
          sparse-checkout: scripts/searches
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match PyAutoHands branch
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          pushd PyAutoHands
          if [[ -n "$(git ls-remote --heads origin "$BRANCH")" ]]; then
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          fi
          popd
      - name: Install the released autofit
        run: pip install --quiet autofit
      - name: Dump the installed search manifest
        run: |
          python -m autofit search-manifest --json > search_manifest.json
          python -c "import json; d = json.load(open('search_manifest.json')); print(d['schema'], 'autofit', d['autofit_version'], len(d['searches']), 'searches')"
      - name: Check roster blocks, anchors and named searches
        run: >
          python PyAutoHands/autohands/check_search_roster.py
          --root "${{ github.event.repository.name }}"
          --manifest search_manifest.json
          --workspace-root .
          --names-in "scripts/searches/*.py"
          --names-in "scripts/cookbooks/search.py"
          --names-in "scripts/guides/modeling/searches.py"
      - name: Multi-start batch_size check, names from the manifest
        run: >
          python PyAutoHands/autohands/check_search_memory.py
          --root "${{ github.event.repository.name }}"
          --manifest search_manifest.json

  staleness:
    name: Catalogue staleness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4
        with:
          path: workspace
      - name: Checkout PyAutoHands
        uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoHands
          path: PyAutoHands
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          cd workspace
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"
      - name: Match PyAutoHands branch
        shell: bash
        run: |
          BRANCH="${{ steps.extract_branch.outputs.branch }}"
          pushd PyAutoHands
          if [[ -n "$(git ls-remote --heads origin "$BRANCH")" ]]; then
            echo "Branch $BRANCH exists in PyAutoHands — checking out"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "Branch $BRANCH not in PyAutoHands — staying on default branch"
          fi
          popd
      - name: Install dependencies
        run: pip install --quiet pyyaml
      - name: Regenerate catalogue (Phase 2 only — no notebook rebuild)
        env:
          NAVIGATOR_PROJECT: ${{ inputs.project }}
        run: |
          cd workspace
          python ../PyAutoHands/autohands/regenerate_navigator.py "$NAVIGATOR_PROJECT"
      - name: Fail if catalogue drifted from scripts
        shell: bash
        run: |
          cd workspace
          if ! git diff --exit-code llms-full.txt workspace_index.json; then
            echo "::error::llms-full.txt / workspace_index.json are stale."
            echo "Regenerate with 'generate.py ${{ inputs.project }}' and commit the result."
            exit 1
          fi
